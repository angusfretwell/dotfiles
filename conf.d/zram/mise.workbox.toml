[bootstrap.packages]
"apt:systemd-zram-generator" = "latest"

[bootstrap.files."/etc/sysctl.d/60-zram.conf"]
content = """
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
"""

[bootstrap.files."/etc/systemd/zram-generator.conf"]
content = """
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
"""
