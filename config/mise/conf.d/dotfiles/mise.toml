[settings.dotfiles]
root = "~/.local/share/chezmoi"

[dotfile_groups.config]
root = "config"
exclude = ["/*"]

[dotfile_groups.config.entries]
"~/.agent-browser/config.json" = "agent-browser/config.json"
"~/.config/bat" = "bat"
"~/.config/btop/btop.conf/shared" = { source = "btop/btop.conf", merge = true, format = "ini" }
"~/.config/ccstatusline" = "ccstatusline"
"~/.config/claudes" = "claudes"
"~/.config/claudes/CLAUDE.md" = { source = "claudes/CLAUDE.md.tera", mode = "template" }
"~/.config/fnox" = "fnox"
"~/.config/gh/config.yml/shared" = { source = "gh/config.yml", merge = true }
"~/.config/ghostty" = { source = "ghostty", variants = [{ os = "macos" }] }
"~/.config/herdr/config.toml/shared" = { source = "herdr/config.toml", merge = true }
"~/.config/micro" = "micro"
"~/.config/micro/settings.json/shared" = { source = "micro/settings.json", merge = true }
"~/.config/starship.toml" = "starship.toml"
"~/.config/worktrunk" = "worktrunk"
"~/.default-gems" = "ruby/default-gems"
"~/.gitconfig" = { source = "git/config.tera", mode = "template" }
"~/.gitignore" = "git/ignore"
"~/.gitmessage" = "git/message"
"~/.aliases" = { source = "shell/aliases.tera", mode = "template" }
"~/.bashrc" = { source = "shell/bashrc.tera", mode = "template" }
"~/.exports" = { source = "shell/exports.tera", mode = "template" }
"~/.zsh_plugins.txt" = "shell/zsh_plugins.txt"
"~/.zshenv" = { source = "shell/zshenv.tera", mode = "template", variants = [{ os = "linux" }] }
"~/.zshrc" = { source = "shell/zshrc.tera", mode = "template" }
"~/.ssh/config" = { source = "ssh/config.tera", mode = "template", permissions = "0600" }
"~/.ssh/commit_signing" = { source = "ssh/commit_signing.tera", mode = "template", permissions = "0600" }
"~/.portless/ca.pem" = { source = "portless/ca.pem.tera", mode = "template", permissions = "0644" }
"~/.portless/ca-key.pem" = { source = "portless/ca-key.pem.tera", mode = "template", permissions = "0600" }

[dotfile_groups.scripts]
root = "scripts"
target = "~/.local/bin"

[dotfile_groups.scripts.entries]
"~/.local/bin/bootstrap" = "../bin/bootstrap"
"~/.local/bin/claudes" = { mode = "template" }
"~/.local/bin/update-skills" = { mode = "template" }
"~/.local/bin/darwin" = { variants = [{ os = "macos" }] }
"~/.local/bin/linux" = { variants = [{ os = "linux" }] }

[dotfiles]
"~/.hushlogin" = { content = "" }
"~/.ssh" = { permissions = "0700" }

[bootstrap.secrets]
commit_signing_key = "COMMIT_SIGNING_KEY"
portless_ca_cert = "PORTLESS_CA_CERT"
portless_ca_key = "PORTLESS_CA_KEY"
