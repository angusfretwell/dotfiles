[settings.dotfiles]
root = "~/.local/share/chezmoi/home"

[dotfile_groups.home]
root = "."
target = "~"
exclude = [
  "*.tera",
  "/.config/ghostty",
  "/.config/mise",
  "/.local/bin/darwin",
  "/.local/bin/linux",
]

[dotfile_groups.home.entries]
"~/.exports" = { source = ".exports.tera", mode = "template" }
"~/.zshrc" = { source = ".zshrc.tera", mode = "template" }
"~/.bashrc" = { source = ".bashrc.tera", mode = "template" }
"~/.aliases" = { source = ".aliases.tera", mode = "template" }
"~/.gitconfig" = { source = ".gitconfig.tera", mode = "template" }
"~/.ssh/config" = { source = ".ssh/config.tera", mode = "template", permissions = "0600" }
"~/.config/claudes/CLAUDE.md" = { source = ".config/claudes/CLAUDE.md.tera", mode = "template" }
"~/.local/bin/claudes" = { source = ".local/bin/claudes.tera", mode = "template", permissions = "0755" }
"~/.local/bin/update-skills" = { source = ".local/bin/update-skills.tera", mode = "template", permissions = "0755" }
"~/.local/bin/bootstrap" = { source = "../bin/bootstrap" }
"~/.config/ghostty" = { source = ".config/ghostty", mode = "symlink-each", variants = [{ os = "macos" }] }
"~/.local/bin/darwin" = { source = ".local/bin/darwin", mode = "symlink-each", variants = [{ os = "macos" }] }
"~/.local/bin/linux" = { source = ".local/bin/linux", mode = "symlink-each", variants = [{ os = "linux" }] }
"~/.zshenv" = { source = ".zshenv.tera", mode = "template", variants = [{ os = "linux" }] }

[dotfiles]
"~/.hushlogin" = { content = "", permissions = "0644" }
"~/.ssh" = { permissions = "0700" }
"~/.config/gh/config.yml/shared" = { source = "gh-config.yml", merge = true }
"~/.config/herdr/config.toml/shared" = { source = "herdr-config.toml", merge = true }
"~/.config/micro/settings.json/shared" = { source = "micro-settings.json", merge = true }
"~/.config/btop/btop.conf/shared" = { source = "btop.conf", merge = true, format = "ini" }
