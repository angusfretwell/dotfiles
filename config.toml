#:schema https://mise.jdx.dev/schema/mise.json

[tools]
bun = "latest"
fnox = "latest"
golang = "latest"
node = { version = "latest", postinstall = "corepack enable" }
op = "latest"
python = "latest"
ruby = "latest"
rust = "latest"
"cargo:cargo-sweep" = "latest"
"npm:agent-browser" = { version = "latest", postinstall = "agent-browser install{% if os() == 'linux' %} --with-deps{% endif %}" }
"npm:agent-desktop" = "latest"
"npm:ccstatusline" = "latest"
"npm:ctx7" = "latest"
"npm:portless" = "latest"
"npm:vercel" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["ruby", "node", "python", "golang"]
trusted_config_paths = ["~/.config/mise/conf.d"]

[tasks.bootstrap]
depends = ["shared:*"]

[dotfile_groups.bin]
root = "bin"
target = "~/.local/bin"

[dotfile_groups.bin.entries]
"~/.local/bin/bootstrap" = "../scripts/bootstrap"
"~/.local/bin/claudes" = { mode = "template" }
"~/.local/bin/update-skills" = { mode = "template" }
"~/.local/bin/laptop" = { variants = [{ os = "macos" }] }
"~/.local/bin/workbox" = { variants = [{ os = "linux" }] }
