[env]
_.path = ["/opt/homebrew/bin", "{{ env.HOME }}/.local/bin"]

[bootstrap.files."/etc/pam.d/sudo_local"]
content = "auth       sufficient     pam_tid.so\n"
owner = "root"
group = "wheel"
mode = "0444"

[bootstrap.macos.launchd.agents.workbox-mount]
program = "~/.local/bin/darwin/workbox-mount"
run_at_load = true
start_interval = 60

[tasks.bootstrap]
depends = ["shared:*", "macos:*"]

[task_config]
includes = ["tasks"]

[dotfiles]
"~/Library/Application Support/Cursor/User/settings.json/managed" = { source = "cursor-settings.jsonc", merge = true, format = "jsonc" }
