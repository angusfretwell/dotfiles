[bootstrap.hooks.pre-packages]
description = "Install Homebrew if missing"
run = '''
[ -x "{{ system_brew_prefix }}/bin/brew" ] || NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
'''

[bootstrap.packages]
"brew:composer" = "latest"
"brew:coreutils" = "latest"
"brew:cowsay" = "latest"
"brew:curl" = "latest"
"brew:duf" = "latest"
"brew:eza" = "latest"
"brew:ffmpeg" = "latest"
"brew:fzf" = "latest"
"brew:glow" = "latest"
"brew:gnupg" = "latest"
"brew:gum" = "latest"
"brew:httpie" = "latest"
"brew:imagemagick" = "latest"
"brew:jq" = "latest"
"brew:mkcert" = "latest"
"brew:mosh" = "latest"
"brew:nano" = "latest"
"brew:nss" = "latest"
"brew:procs" = "latest"
"brew:pv" = "latest"
"brew:qrencode" = "latest"
"brew:qsv" = "latest"
"brew:shfmt" = "latest"
"brew:sqlite" = "latest"
"brew:tealdeer" = "latest"
"brew:the_silver_searcher" = "latest"
"brew:watchman" = "latest"
"brew:wget" = "latest"
"brew:yq" = "latest"
"brew:zoxide" = "latest"

"brew:awscli" = "latest"
"brew:biome" = "latest"
"brew:ddev/ddev/ddev" = "latest"
"brew:flyctl" = "latest"
"brew:libpq" = "latest"
"brew:mago" = "latest"
"brew:mysql-client" = "latest"
"brew:overmind" = "latest"
"brew:stripe-cli" = "latest"
"brew:uv" = "latest"
