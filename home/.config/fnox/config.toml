[providers.commit_signing]
type = "1password"

[providers.portless_ca_cert]
type = "1password"

[providers.portless_ca_key]
type = "1password"

[secrets]
COMMIT_SIGNING_KEY = { provider = "commit_signing", value = "op://Workbox/Commit Signing/private key?ssh-format=openssh", if_missing = "error" }
PORTLESS_CA_CERT = { provider = "portless_ca_cert", value = "op://Workbox/Workbox CA/workbox-ca.crt", if_missing = "error" }
PORTLESS_CA_KEY = { provider = "portless_ca_key", value = "op://Workbox/Workbox CA/workbox-ca.key", if_missing = "error" }

[profiles.linux.providers.restic_password]
type = "1password"

[profiles.linux.providers.restic_endpoint]
type = "1password"

[profiles.linux.providers.restic_bucket]
type = "1password"

[profiles.linux.providers.restic_username]
type = "1password"

[profiles.linux.providers.restic_credential]
type = "1password"

[profiles.linux.secrets]
RESTIC_PASSWORD = { provider = "restic_password", value = "op://Workbox/Restic/password", if_missing = "error" }
RESTIC_ENDPOINT = { provider = "restic_endpoint", value = "op://Workbox/Restic/endpoint", if_missing = "error" }
RESTIC_BUCKET = { provider = "restic_bucket", value = "op://Workbox/Restic/bucket", if_missing = "error" }
RESTIC_USERNAME = { provider = "restic_username", value = "op://Workbox/Restic/username", if_missing = "error" }
RESTIC_CREDENTIAL = { provider = "restic_credential", value = "op://Workbox/Restic/credential", if_missing = "error" }
