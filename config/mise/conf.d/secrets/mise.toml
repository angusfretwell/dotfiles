[bootstrap.secrets]
commit_signing_key = "COMMIT_SIGNING_KEY"
portless_ca_cert = "PORTLESS_CA_CERT"
portless_ca_key = "PORTLESS_CA_KEY"

[dotfiles."~/.ssh/commit_signing"]
source = "files/commit-signing.tera"
mode = "template"
permissions = "0600"

[dotfiles."~/.portless/ca.pem"]
source = "files/portless-ca-cert.tera"
mode = "template"
permissions = "0644"

[dotfiles."~/.portless/ca-key.pem"]
source = "files/portless-ca-key.tera"
mode = "template"
permissions = "0600"
